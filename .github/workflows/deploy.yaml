name: CI/CD Pipeline - Test and Deploy

on:
  push:
    branches:
      - main
  pull_request:       # <-- THIS IS REQUIRED FOR PRs
      branches:
        - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Test 1: HTML Linting
      - name: Lint HTML
        run: npx htmlhint "**/*.html"

      # Test 2: Check for broken links
      - name: Check Links
        uses: lycheeverse/lychee-action@v1
        with:
          args: --verbose --no-progress './**/*.html'

  deploy:
    needs: test # Deployment only runs if the 'test' job succeeds
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./